# ==============================================================================
# SYNTRA GROUP - NGINX CONFIGURATION FOR UNIFIED DOMAIN & CRM
# Domain: syntrasupply.com / www.syntrasupply.com / admin.syntrasupply.com
# ==============================================================================

# Rate limiting zone for public API protection
limit_req_zone $binary_remote_addr zone=syntra_api_limit:10m rate=15r/s;

# 1. HTTP Redirect to HTTPS (Syntra Supply Public Web & Admin CRM)
server {
    listen 80;
    listen [::]:80;
    server_name syntrasupply.com www.syntrasupply.com admin.syntrasupply.com;

    # Let's Encrypt ACME Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Public E-Shop: https://syntrasupply.com & https://www.syntrasupply.com
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name syntrasupply.com www.syntrasupply.com;

    # SSL Certificates (Managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/syntrasupply.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/syntrasupply.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security & Performance Headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    client_max_body_size 30M;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;

    # Reverse Proxy to Syntra Python Server (Port 8500)
    location / {
        proxy_pass http://127.0.0.1:8500;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 15s;
    }

    # Public API Rate Limiting
    location /api/ {
        limit_req zone=syntra_api_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:8500;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 3. Private Admin CRM Subdomain: https://admin.syntrasupply.com
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.syntrasupply.com;

    # SSL Certificates
    ssl_certificate /etc/letsencrypt/live/syntrasupply.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/syntrasupply.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    client_max_body_size 50M;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:8500;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
